[package]
name = "ck-forge-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/contest-keeper/ck-forge"
rust-version = "1.89"
description = "The Keeper Forge window"

# Its own workspace, so `cargo test` at the root of the repository does not build the window (which
# needs WebView2 on Windows and system libraries elsewhere).
[workspace]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[build-dependencies]
tauri-build = "2"

[dependencies]
ck-admin-core = { path = "../crates/ck-admin-core" }
ck-writer = { path = "../crates/ck-writer" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "dae0c134c3eec8d1efff27c4cc69fecd6a8d1bdf" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
tauri-plugin-dialog = "2"

[profile.dev.package.sha2]
opt-level = 3

[features]
# Set by `tauri build`: use the page built into the program instead of the development server.
custom-protocol = ["tauri/custom-protocol"]
