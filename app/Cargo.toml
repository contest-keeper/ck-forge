[package]
name = "ck-forge-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/contest-keeper/ck-forge"
rust-version = "1.89"
description = "The Keeper Forge window"

# Its own workspace, so `cargo test` at the root of the repository does not build the window (which
# needs WebView2 on Windows and system libraries elsewhere).
[workspace]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ck-admin-core = { path = "../crates/ck-admin-core" }
ck-writer = { path = "../crates/ck-writer" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "f4796fe7f0546076f1013fb842f85af30dbfb05d" }
base64 = "0.22.1"
open = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
semver = "1"

# Keeps the Hub sign-in between runs, in the Windows Credential Manager.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.dev.package.sha2]
opt-level = 3

[features]
# Set by `tauri build`: use the page built into the program instead of the development server.
custom-protocol = ["tauri/custom-protocol"]
