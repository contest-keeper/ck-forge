# The installer's window program (Tauri). The same list as the root `about.toml` plus MPL-2.0: the
# Tauri stack uses a few MPL-2.0 crates (for example option-ext), used unmodified as libraries.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
targets = ["x86_64-pc-windows-gnu"]
