[advisories]
yanked = "deny"
# chrono is flagged unmaintained, with no fixed version. It is a dependency of ck-protocol as well, so
# it cannot be dropped from this repo alone. Remove this once ck-protocol and ck-forge use jiff or time.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no patched version; replace with jiff or time" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-org = { github = ["contest-keeper"] }
