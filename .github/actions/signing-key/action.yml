name: Update signing key
description: >
  Reads the key that signs Keeper Forge updates from the environment's Key Vault, or makes it on the
  very first run. Run it after the checkout, with Rust installed and the job's environment set, so
  Azure accepts the sign-in. Sets CK_UPDATE_SIGNING_KEY for tools/update-signer and returns the public
  key to build into the app.

inputs:
  environment:
    description: develop or production
    required: true
  client-id:
    required: true
  tenant-id:
    required: true
  subscription-id:
    required: true

outputs:
  pubkey:
    description: The public key the installed app uses to check an update
    value: ${{ steps.key.outputs.pubkey }}

runs:
  using: composite
  steps:
    - uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
    - id: key
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        # Each environment has its own subscription, so the group has the same name in both.
        case "$ENVIRONMENT" in
          develop|production) group=rg-ckhub ;;
          *) echo "environment must be develop or production" >&2; exit 1 ;;
        esac
        vault=$(az keyvault list --resource-group "$group" --query "[0].name" -o tsv)
        test -n "$vault" || { echo "No Key Vault in $group: deploy the Hub first" >&2; exit 1; }

        # The key must never change once an app has been built with its public half, or installed
        # copies would refuse every later update. So it is made only when it is missing. The caller's
        # concurrency group keeps two runs from making it at the same time.
        # Only "not found" counts as missing: any other failure stops the job, so a passing Azure or
        # permission error cannot replace the key.
        if ! error=$(az keyvault secret show --vault-name "$vault" --name forge-update-key --query id -o tsv 2>&1 > /dev/null); then
          case "$error" in
            *SecretNotFound*) ;;
            *) echo "$error" >&2; exit 1 ;;
          esac
          dir=$(mktemp -d)
          cargo run --release --locked --manifest-path tools/update-signer/Cargo.toml -- generate "$dir/private" "$dir/public"
          az keyvault secret set --vault-name "$vault" --name forge-update-pubkey --file "$dir/public" --output none
          # Last, so that finding the private key means the public one is there too.
          az keyvault secret set --vault-name "$vault" --name forge-update-key --file "$dir/private" --output none
          rm -rf "$dir"
        fi

        private=$(az keyvault secret show --vault-name "$vault" --name forge-update-key --query value -o tsv)
        echo "::add-mask::$private"
        echo "CK_UPDATE_SIGNING_KEY=$private" >> "$GITHUB_ENV"
        echo "pubkey=$(az keyvault secret show --vault-name "$vault" --name forge-update-pubkey --query value -o tsv)" >> "$GITHUB_OUTPUT"
