name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: contest-keeper/.github/.github/workflows/release-please.yml@main
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # The Windows installer (per-machine, so the elevated helper sits in a folder only administrators
  # can write) and the command line tool. Both get stable names: the download links under
  # /releases/latest/download/ never change.
  windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app
      - name: Build the command line tool and place it as the installer's helper
        run: |
          cargo build --release --locked -p ck-forge
          mkdir -p app/binaries
          cp target/release/ck-forge.exe app/binaries/ck-forge-x86_64-pc-windows-gnu.exe
        shell: bash
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Write the third-party licences
        # Fails on a licence that is not allowed (about.toml) or on an empty result. The file goes
        # into the installer and is published with the release.
        run: |
          mkdir -p out
          tools/make-licences.sh out/THIRD-PARTY-LICENSES.txt
          cp out/THIRD-PARTY-LICENSES.txt app/THIRD-PARTY-LICENSES.txt
          echo '{"bundle":{"resources":["THIRD-PARTY-LICENSES.txt"]}}' > app/bundle-licences.json
        shell: bash
      - name: Build the installer
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-gnu --config bundle-licences.json
        working-directory: app
        # Only a release signs in to, and reports to, the production Hub.
        env:
          CK_HUB_URL: https://hub.contestkeeper.com
      - name: Collect the files under stable names
        run: |
          cp app/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe out/keeper-forge-setup-x64.exe
          cp target/release/ck-forge.exe out/ck-forge-windows-x64.exe
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows
          path: out/*
          if-no-files-found: error

  # The macOS download the website's button looks for (keeper-forge-macos-universal.dmg). Off until the
  # repository variable CK_MACOS_CI is `true`: on 2026-11-24 GitHub refused to start macOS runners for
  # this organization. The file is put straight on the release, with a build attestation.
  macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.CK_MACOS_CI == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-macos-release
          workspaces: |
            .
            app-egui
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build the universal app
        run: |
          mkdir -p out
          tools/make-macos-dmg.sh "${TAG#v}" out/keeper-forge-macos-universal.dmg
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          # Only a release signs in to, and reports to, the production Hub.
          CK_HUB_URL: https://hub.contestkeeper.com
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/keeper-forge-macos-universal.dmg
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" out/keeper-forge-macos-universal.dmg --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [release-please, windows]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: contest-keeper/.github/.github/workflows/release-assets.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      artifact_name: forge-windows
