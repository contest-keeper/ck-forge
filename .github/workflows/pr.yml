name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    uses: contest-keeper/.github/.github/workflows/pr-title.yml@main
  common:
    uses: contest-keeper/.github/.github/workflows/common-ci.yml@main
  rust:
    uses: contest-keeper/.github/.github/workflows/rust-ci.yml@main
  ui:
    uses: contest-keeper/.github/.github/workflows/web-ci.yml@main
    with:
      working-directory: ui
  window:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Place the command line tool where the installer config expects it
        run: |
          cargo build --release --locked -p ck-forge
          mkdir -p app/binaries
          cp target/release/ck-forge.exe app/binaries/ck-forge-x86_64-pc-windows-gnu.exe
        shell: bash
      - run: cargo clippy -- -D warnings
        working-directory: app
      - run: cargo build --features custom-protocol
        working-directory: app
      - name: Build the installer
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-gnu
        working-directory: app
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p ck-forge
      - uses: actions/upload-artifact@v4
        with:
          name: ck-forge-windows
          path: target/release/ck-forge.exe
          if-no-files-found: error
