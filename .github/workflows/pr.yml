name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  common:
    uses: contest-keeper/.github/.github/workflows/common-ci.yml@main
  rust:
    uses: contest-keeper/.github/.github/workflows/rust-ci.yml@main
  ui:
    uses: contest-keeper/.github/.github/workflows/web-ci.yml@main
    with:
      working-directory: ui
  window:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-windows
          workspaces: |
            .
            app
      - name: Place the command line tool where the installer config expects it
        run: |
          cargo build --release --locked -p ck-forge
          mkdir -p app/binaries
          cp target/release/ck-forge.exe app/binaries/ck-forge-x86_64-pc-windows-gnu.exe
        shell: bash
      - run: cargo clippy -- -D warnings
        working-directory: app
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Write the third-party licences
        # Fails on a licence that is not allowed (about.toml) or on an empty result. The file goes
        # into the installer and is published with the release.
        run: |
          mkdir -p out
          tools/make-licences.sh out/THIRD-PARTY-LICENSES.txt
          cp out/THIRD-PARTY-LICENSES.txt app/THIRD-PARTY-LICENSES.txt
          echo '{"bundle":{"resources":["THIRD-PARTY-LICENSES.txt"]}}' > app/bundle-licences.json
        shell: bash
      - name: Build the installer
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-gnu --config bundle-licences.json
        working-directory: app
  windows-test:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-windows-test
      - run: cargo test --workspace
  macos-test:
    # The disk code for macOS reads recorded diskutil plists, so it is tested here without a disk.
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-macos-test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  egui:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-egui
          workspaces: app-egui
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app-egui
      - run: cargo test
        working-directory: app-egui
