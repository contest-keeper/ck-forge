name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  common:
    uses: contest-keeper/.github/.github/workflows/common-ci.yml@main
  rust:
    uses: contest-keeper/.github/.github/workflows/rust-ci.yml@main
  windows-test:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      # The installer is two optimized builds and takes about five minutes, so it is only built when
      # the pull request can change it. The checkout is the pull request merged into its base, so
      # the difference with the base is exactly what the pull request changes. Releases still build it.
      - name: Check whether the installer can change
        id: installer
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^(app-egui/installer/|tools/|about\.(toml|hbs)$|app-egui/(about\.toml|Cargo\.(toml|lock))$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/(pr|release)\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-windows-test
      - run: cargo test --workspace
  macos-test:
    # The disk code for macOS reads recorded diskutil plists, so it is tested here without a disk.
    # Off until the repository variable CK_MACOS_CI is `true`: on 2026-11-24 GitHub refused to start
    # macOS runners for this organization ("configuration macos-14-arm64-us-default is not supported").
    if: vars.CK_MACOS_CI == 'true'
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-macos-test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  egui:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-egui
          workspaces: |
            .
            app-egui
            tools/update-signer
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: app-egui
      - run: cargo test --locked
        working-directory: app-egui
      # The tool that signs updates is its own workspace, so the root checks do not reach it.
      - run: cargo fmt --check
        working-directory: tools/update-signer
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: tools/update-signer
      - run: cargo test --locked
        working-directory: tools/update-signer
      - run: tools/test-update-manifest.sh
        shell: bash
      - uses: taiki-e/install-action@v2
        if: steps.installer.outputs.build == 'true'
        with:
          tool: cargo-about
      - name: Install NSIS
        if: steps.installer.outputs.build == 'true'
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
        shell: bash
      # The same steps as the published builds, so a broken installer or a licence that is not allowed
      # (app-egui/about.toml) stops the pull request and not the build after the merge.
      - name: Build the installer
        if: steps.installer.outputs.build == 'true'
        run: |
          cargo build --release --locked -p ck-forge --target-dir target
          cargo build --release --locked --manifest-path app-egui/Cargo.toml --target-dir app-egui/target
          mkdir -p egui-out
          tools/make-egui-licences.sh egui-out/THIRD-PARTY-LICENSES.txt
          tools/make-egui-installer.sh 0.0.0 egui-out/THIRD-PARTY-LICENSES.txt egui-out/keeper-forge-setup-x64.exe
        shell: bash
      # For a person to try the upgrade on a real PC before merging.
      - uses: actions/upload-artifact@v4
        if: steps.installer.outputs.build == 'true'
        with:
          name: forge-installer-preview
          path: egui-out/keeper-forge-setup-x64.exe
          if-no-files-found: error
