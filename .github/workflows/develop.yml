name: Develop

# Every merge to develop builds the Windows installer and the command line tool and publishes them as
# the "dev" pre-release, and puts them on the develop site's Azure storage for download. The pre-release is updated on every run,
# so its download links never change:
#   https://github.com/contest-keeper/ck-forge/releases/download/dev/keeper-forge-setup-x64.exe

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Builds queue up instead of cancelling each other, so a run is never stopped half way through
# publishing and the dev release always matches a finished build.
concurrency:
  group: develop-build
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    environment: develop
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history and the tags are needed to count the commits since the last release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The name is <next release>-preview.<commits since the last release>, e.g. 0.2.0-preview.14, so a
      # higher number is always a newer build. Before the first release it counts from the start. The
      # installed app carries this version, which is how it knows a newer build exists.
      - id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            base=$(tr -d '[:space:]' < version.txt)
            count=$(git rev-list --count HEAD)
          else
            IFS=. read -r major minor _ <<< "${last#v}"
            base="${major}.$((minor + 1)).0"
            count=$(git rev-list --count "${last}..HEAD")
          fi
          echo "version=${base}-preview.${count}" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-windows
          workspaces: |
            .
            app
            app-egui
      # Signs the update with the develop key kept in Azure Key Vault (made on the first run).
      - id: key
        uses: ./.github/actions/signing-key
        with:
          environment: develop
          client-id: ${{ vars.AZURE_CLIENT_ID_DEVELOP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build the command line tool and place it as the installer's helper
        run: |
          cargo build --release --locked -p ck-forge
          mkdir -p app/binaries
          cp target/release/ck-forge.exe app/binaries/ck-forge-x86_64-pc-windows-gnu.exe
        shell: bash
      - name: Build the installer
        # This build looks for updates in the develop feed and carries the preview version.
        run: |
          config=$(jq -nc --arg version "$VERSION" --arg pubkey "$PUBKEY" --arg feed "$FEED" \
            '{version: $version, bundle: {createUpdaterArtifacts: true},
              plugins: {updater: {pubkey: $pubkey, endpoints: [$feed]}}}')
          node ../ui/node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-gnu --config "$config"
        shell: bash
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBKEY: ${{ steps.key.outputs.pubkey }}
          FEED: https://github.com/contest-keeper/ck-forge/releases/download/dev/update.json
      # The egui window, the installer that is meant to replace the Tauri window, and the feed its updater
      # reads. The Tauri window is what people install today, so none of these steps may stop its build:
      # when one fails the egui files are left out and the rest of the build goes on.
      - name: Install NSIS
        id: egui_nsis
        continue-on-error: true
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
        shell: bash
      - uses: taiki-e/install-action@v2
        id: egui_about
        continue-on-error: true
        with:
          tool: cargo-about
      - name: Build the egui window
        id: egui_build
        if: steps.egui_nsis.outcome == 'success' && steps.egui_about.outcome == 'success'
        continue-on-error: true
        # It looks for updates in the develop feed, with the same key as the Tauri window.
        run: |
          cargo build --release --locked --manifest-path app-egui/Cargo.toml
          mkdir -p egui-out
          cp app-egui/target/release/ck-forge-egui.exe egui-out/keeper-forge.exe
          cp target/release/ck-forge.exe egui-out/ck-forge.exe
          (cd app-egui && cargo about generate --locked -c about.toml ../about.hbs -o ../egui-out/window-licences.txt)
          cargo about generate --locked about.hbs -o egui-out/tool-licences.txt
          {
            echo "Keeper Forge: third-party licences"
            echo
            echo "Part 1: the window program"
            cat egui-out/window-licences.txt
            echo
            echo "Part 2: the command line tool"
            cat egui-out/tool-licences.txt
          } > egui-out/THIRD-PARTY-LICENSES.txt
        shell: bash
        env:
          CK_FORGE_VERSION: ${{ steps.version.outputs.version }}
          CK_UPDATE_PUBKEY: ${{ steps.key.outputs.pubkey }}
          CK_UPDATE_FEED: https://github.com/contest-keeper/ck-forge/releases/download/dev/update-egui.json
      # Code signing needs the organization's certificate, which is not in this repository's secrets
      # yet. Until then the steps that sign are skipped and the installer is signed only with the
      # update key (which is what the updater checks).
      - name: Is code signing set up
        id: codesign
        run: |
          if [ -n "$PFX" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
        shell: bash
        env:
          PFX: ${{ secrets.CK_CODESIGN_PFX_BASE64 }}
      - name: Sign the egui programs
        if: steps.egui_build.outcome == 'success' && steps.codesign.outputs.enabled == 'true'
        run: tools/codesign.ps1 egui-out/keeper-forge.exe egui-out/ck-forge.exe
        shell: pwsh
        env:
          CK_CODESIGN_PFX_BASE64: ${{ secrets.CK_CODESIGN_PFX_BASE64 }}
          CK_CODESIGN_PASSWORD: ${{ secrets.CK_CODESIGN_PASSWORD }}
      - name: Build the egui installer
        id: egui_installer
        if: steps.egui_build.outcome == 'success'
        continue-on-error: true
        run: |
          makensis -V2 "-DVERSION=$VERSION" \
            "-DAPP=$(cygpath -w egui-out/keeper-forge.exe)" \
            "-DHELPER=$(cygpath -w egui-out/ck-forge.exe)" \
            "-DLICENCE=$(cygpath -w LICENSE)" \
            "-DTHIRDPARTY=$(cygpath -w egui-out/THIRD-PARTY-LICENSES.txt)" \
            "-DOUTFILE=$(cygpath -w egui-out/keeper-forge-egui-setup-x64.exe)" \
            app-egui/installer/keeper-forge.nsi
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Sign the egui installer
        if: steps.egui_installer.outcome == 'success' && steps.codesign.outputs.enabled == 'true'
        run: tools/codesign.ps1 egui-out/keeper-forge-egui-setup-x64.exe
        shell: pwsh
        env:
          CK_CODESIGN_PFX_BASE64: ${{ secrets.CK_CODESIGN_PFX_BASE64 }}
          CK_CODESIGN_PASSWORD: ${{ secrets.CK_CODESIGN_PASSWORD }}
      - name: Sign the egui installer for the updater and write its feed
        id: egui_feed
        if: steps.egui_installer.outcome == 'success'
        continue-on-error: true
        run: |
          node ui/node_modules/@tauri-apps/cli/tauri.js signer sign egui-out/keeper-forge-egui-setup-x64.exe
          tools/make-update-manifest.sh "$VERSION" \
            https://github.com/contest-keeper/ck-forge/releases/download/dev/keeper-forge-egui-setup-x64.exe \
            egui-out/keeper-forge-egui-setup-x64.exe.sig min-version.txt egui-out/update-egui.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Collect the files under stable names
        run: |
          mkdir out
          cp app/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe out/keeper-forge-setup-x64.exe
          cp target/release/ck-forge.exe out/ck-forge-windows-x64.exe
          tools/make-update-manifest.sh "$VERSION" \
            https://github.com/contest-keeper/ck-forge/releases/download/dev/keeper-forge-setup-x64.exe \
            app/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe.sig min-version.txt out/update.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Add the egui installer and its feed
        if: steps.egui_feed.outcome == 'success'
        run: cp egui-out/keeper-forge-egui-setup-x64.exe egui-out/update-egui.json out/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows
          path: out/*
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The release is updated in place, never deleted, so the download links keep working while a
      # new build is on its way: the tag moves to this commit and the files are replaced by publish.
      - name: Update the dev pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          title="Preview build ${VERSION}"
          notes="Built from develop at ${SHA}. Not a release: it is replaced on every merge to develop."
          git tag -f dev "$SHA"
          git push --force origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --title "$title" --notes "$notes"
          else
            gh release create dev --prerelease --verify-tag --title "$title" --notes "$notes"
          fi

  publish:
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: contest-keeper/.github/.github/workflows/release-assets.yml@develop
    with:
      tag_name: dev
      artifact_name: forge-windows

  # The develop site serves the download from Azure, so the installer there is replaced too.
  azure:
    needs: [windows, release]
    permissions:
      contents: read
      id-token: write
    uses: contest-keeper/ck-infra/.github/workflows/publish-download.yml@develop
    with:
      environment: develop
      artifact: forge-windows
      folder: forge
      version: ${{ needs.windows.outputs.version }}
