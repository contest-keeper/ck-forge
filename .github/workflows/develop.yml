name: Develop

# Every merge to develop builds the Windows installer and the command line tool and publishes them as
# the "dev" pre-release, and puts them on the develop site's Azure storage for download. The pre-release is updated on every run,
# so its download links never change:
#   https://github.com/contest-keeper/ck-forge/releases/download/dev/keeper-forge-setup-x64.exe

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Builds queue up instead of cancelling each other, so a run is never stopped half way through
# publishing and the dev release always matches a finished build.
concurrency:
  group: develop-build
  cancel-in-progress: false

jobs:
  # The version, and the update key, which both builds need before they start.
  prepare:
    runs-on: ubuntu-latest
    environment: develop
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history and the tags are needed to count the commits since the last release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The name is <next release>-preview.<commits since the last release>, e.g. 0.2.0-preview.14, so a
      # higher number is always a newer build. Before the first release it counts from the start. The
      # installed app carries this version, which is how it knows a newer build exists.
      - id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            base=$(tr -d '[:space:]' < version.txt)
            count=$(git rev-list --count HEAD)
          else
            IFS=. read -r major minor _ <<< "${last#v}"
            base="${major}.$((minor + 1)).0"
            count=$(git rev-list --count "${last}..HEAD")
          fi
          echo "version=${base}-preview.${count}" >> "$GITHUB_OUTPUT"
        shell: bash
      # The key is made here when it is missing, so the two builds can run at once and never both make one.
      - id: key
        uses: ./.github/actions/signing-key
        with:
          environment: develop
          client-id: ${{ vars.AZURE_CLIENT_ID_DEVELOP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  windows:
    needs: prepare
    runs-on: windows-latest
    environment: develop
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-windows
          workspaces: |
            .
            app-egui
            tools/update-signer
      # Signs the update with the develop key kept in Azure Key Vault (made on the first run).
      - id: key
        uses: ./.github/actions/signing-key
        with:
          environment: develop
          client-id: ${{ vars.AZURE_CLIENT_ID_DEVELOP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # A build without the public key looks for no updates and could never be updated.
      - name: Check the update key
        run: test -n "$PUBKEY" || { echo "::error::The signing key step returned no public key"; exit 1; }
        shell: bash
        env:
          PUBKEY: ${{ steps.key.outputs.pubkey }}
      - name: Install NSIS
        run: |
          # Only NSIS 3 in its own folder counts: this compiler builds the installer that gets signed.
          nsis="/c/Program Files (x86)/NSIS/makensis.exe"
          if ! "$nsis" -VERSION 2>/dev/null | grep -q '^v3\.'; then
            choco install nsis --no-progress -y
          fi
          "$nsis" -VERSION | grep '^v3\.'
          echo "MAKENSIS=$nsis" >> "$GITHUB_ENV"
        shell: bash
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The window looks for updates in the develop feed and carries the preview version.
      - name: Build the window and the command line tool
        run: |
          cargo build --release --locked -p ck-forge --target-dir target
          cargo build --release --locked --manifest-path app-egui/Cargo.toml --target-dir app-egui/target
          mkdir -p egui-out
          tools/make-egui-licences.sh egui-out/THIRD-PARTY-LICENSES.txt
        shell: bash
        env:
          CK_FORGE_VERSION: ${{ needs.prepare.outputs.version }}
          CK_UPDATE_PUBKEY: ${{ steps.key.outputs.pubkey }}
          CK_UPDATE_FEED: https://github.com/contest-keeper/ck-forge/releases/download/dev/update.json
      # Code signing needs the organization's certificate, which is not in this repository's secrets
      # yet. Until then the steps that sign are skipped and the installer is signed only with the
      # update key (which is what the updater checks).
      - name: Is code signing set up
        id: codesign
        run: |
          if [ -n "$PFX" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
        shell: bash
        env:
          PFX: ${{ secrets.CK_CODESIGN_PFX_BASE64 }}
      # A failed signature fails the build, so nothing unsigned is published once signing is set up.
      - name: Sign the programs
        if: steps.codesign.outputs.enabled == 'true'
        run: tools/codesign.ps1 app-egui/target/release/ck-forge-egui.exe target/release/ck-forge.exe
        shell: pwsh
        env:
          CK_CODESIGN_PFX_BASE64: ${{ secrets.CK_CODESIGN_PFX_BASE64 }}
          CK_CODESIGN_PASSWORD: ${{ secrets.CK_CODESIGN_PASSWORD }}
      - name: Build the installer
        run: tools/make-egui-installer.sh "$VERSION" egui-out/THIRD-PARTY-LICENSES.txt egui-out/keeper-forge-setup-x64.exe
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - name: Sign the installer
        if: steps.codesign.outputs.enabled == 'true'
        run: tools/codesign.ps1 egui-out/keeper-forge-setup-x64.exe
        shell: pwsh
        env:
          CK_CODESIGN_PFX_BASE64: ${{ secrets.CK_CODESIGN_PFX_BASE64 }}
          CK_CODESIGN_PASSWORD: ${{ secrets.CK_CODESIGN_PASSWORD }}
      # The update signature covers the final bytes, so it comes after code signing.
      - name: Sign the installer for the updater and collect the files under stable names
        run: |
          cargo run --release --locked --manifest-path tools/update-signer/Cargo.toml -- sign egui-out/keeper-forge-setup-x64.exe
          mkdir out
          cp egui-out/keeper-forge-setup-x64.exe out/keeper-forge-setup-x64.exe
          cp target/release/ck-forge.exe out/ck-forge-windows-x64.exe
          tools/make-update-manifest.sh "$VERSION" \
            https://github.com/contest-keeper/ck-forge/releases/download/dev/keeper-forge-setup-x64.exe \
            egui-out/keeper-forge-setup-x64.exe.sig min-version.txt out/update.json
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows
          path: out/*
          if-no-files-found: error

  # Off until the repository variable CK_MACOS_CI is `true`: GitHub refused to start macOS runners for
  # this organization on 2026-11-24.
  macos:
    needs: prepare
    if: vars.CK_MACOS_CI == 'true'
    runs-on: macos-latest
    environment: develop
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-macos-develop
          workspaces: |
            .
            app-egui
            tools/update-signer
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The same key as the Windows installer: the prepare job has made it if it was missing.
      - id: key
        uses: ./.github/actions/signing-key
        with:
          environment: develop
          client-id: ${{ vars.AZURE_CLIENT_ID_DEVELOP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # A build without the public key looks for no updates and could never be updated.
      - name: Check the update key
        run: test -n "$PUBKEY" || { echo "::error::The signing key step returned no public key"; exit 1; }
        shell: bash
        env:
          PUBKEY: ${{ steps.key.outputs.pubkey }}
      - name: Build the universal app
        run: |
          mkdir -p mac
          tools/make-macos-dmg.sh "$VERSION" mac/keeper-forge-macos-universal.dmg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CK_UPDATE_PUBKEY: ${{ steps.key.outputs.pubkey }}
          CK_UPDATE_FEED: https://github.com/contest-keeper/ck-forge/releases/download/dev/update.json
      - name: Sign the disk image for the updater
        run: |
          cargo run --release --locked --manifest-path tools/update-signer/Cargo.toml -- sign mac/keeper-forge-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: forge-macos
          path: mac/*
          if-no-files-found: error
          overwrite: true

  # Everything that is published, in one artifact, so the feed is complete before it is checksummed,
  # attested and uploaded: nothing is edited afterwards.
  bundle:
    needs: [prepare, windows, macos]
    # A failed macOS build does not hold back Windows: the feed then has no macOS entry.
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: forge-windows
          path: out
      - uses: actions/download-artifact@v4
        if: needs.macos.result == 'success'
        with:
          name: forge-macos
          path: mac
      - name: Add the macOS disk image to the update feed
        if: needs.macos.result == 'success'
        run: |
          tools/add-macos-update.sh "$VERSION" \
            https://github.com/contest-keeper/ck-forge/releases/download/dev/keeper-forge-macos-universal.dmg \
            mac/keeper-forge-macos-universal.dmg.sig out/update.json
          cp mac/keeper-forge-macos-universal.dmg out/
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      # The feed that earlier previews of this window still read.
      - run: cp out/update.json out/update-egui.json
      - uses: actions/upload-artifact@v4
        with:
          name: forge-release
          path: out/*
          if-no-files-found: error
          overwrite: true

  release:
    needs: [prepare, bundle]
    # A status check is needed here and below: a skipped macOS job would otherwise skip these too.
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The release is updated in place, never deleted, so the download links keep working while a
      # new build is on its way: the tag moves to this commit and the files are replaced by publish.
      - name: Update the dev pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          title="Preview build ${VERSION}"
          notes="Built from develop at ${SHA}. Not a release: it is replaced on every merge to develop."
          git tag -f dev "$SHA"
          git push --force origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --title "$title" --notes "$notes"
          else
            gh release create dev --prerelease --verify-tag --title "$title" --notes "$notes"
          fi

  publish:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: contest-keeper/.github/.github/workflows/release-assets.yml@develop
    with:
      tag_name: dev
      artifact_name: forge-release

  # The develop site serves the download from Azure, so the installer there is replaced too.
  azure:
    needs: [prepare, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: contest-keeper/ck-infra/.github/workflows/publish-download.yml@develop
    with:
      environment: develop
      artifact: forge-release
      folder: forge
      version: ${{ needs.prepare.outputs.version }}
