name: Warm caches

# Pull requests restore the build caches saved on their base branch. Building develop here keeps those
# caches fresh, so a new pull request does not start from a cold Rust build.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  rust:
    uses: contest-keeper/.github/.github/workflows/rust-ci.yml@main
  windows-test:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-windows-test
      - run: cargo test --locked --workspace --no-run
  egui:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned GNU toolchain
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=1.99.1-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-egui
          workspaces: |
            .
            app-egui
            tools/update-signer
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: app-egui
      - run: cargo test --locked --no-run
        working-directory: app-egui
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: tools/update-signer
      - run: cargo test --locked --no-run
        working-directory: tools/update-signer
