[package]
name = "ck-forge-egui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/contest-keeper/ck-forge"
rust-version = "1.89"
description = "The Keeper Forge window, in egui"

# Its own workspace, like `app/`, so `cargo test` at the root does not build a window.
[workspace]

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[dependencies]
ck-admin-core = { path = "../crates/ck-admin-core" }
ck-writer = { path = "../crates/ck-writer" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "9af064ac5e9b1d1fd788485a329c98ac46c1f98a", version = "0.1.0" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
open = "5"
minisign-verify = "0.2.5"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.1.2"
rfd = "0.18"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
minisign = "0.7"
tempfile = "3.27.0"

[profile.dev.package.sha2]
opt-level = 3
