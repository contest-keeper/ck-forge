[package]
name = "ck-admin-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ck-crypto = { git = "https://github.com/contest-keeper/ck-protocol", rev = "abf69fab780bb3d12ab73b18e3c4c99593a9aa5f", version = "0.1.0" }
ck-image = { git = "https://github.com/contest-keeper/ck-protocol", rev = "abf69fab780bb3d12ab73b18e3c4c99593a9aa5f", version = "0.1.0" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "abf69fab780bb3d12ab73b18e3c4c99593a9aa5f", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
crc32fast = "1.5.5"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1.1"
