[package]
name = "ck-admin-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ck-base-image = { path = "../ck-base-image", version = "0.1.0" }
ck-crypto = { git = "https://github.com/contest-keeper/ck-protocol", rev = "f4796fe7f0546076f1013fb842f85af30dbfb05d", version = "0.1.0" }
ck-image = { git = "https://github.com/contest-keeper/ck-protocol", rev = "f4796fe7f0546076f1013fb842f85af30dbfb05d", version = "0.1.0" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "f4796fe7f0546076f1013fb842f85af30dbfb05d", version = "0.1.0" }
ck-writer = { path = "../ck-writer", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.47", default-features = false, features = ["std", "local-offset", "serde-well-known"] }
ureq = { version = "3.1.2", features = ["json"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
base64 = "0.22.1"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
crc32fast = "1.5.5"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1.1"
