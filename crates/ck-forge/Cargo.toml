[package]
name = "ck-forge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ck-admin-core = { path = "../ck-admin-core", version = "0.1.0" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "7d7c2ee06268c0f9776cb74c7af3373f00ce4757", version = "0.1.0" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.51", features = ["derive"] }
indicatif = "0.18.0"

[dev-dependencies]
tempfile = "3.27.0"
ck-image = { git = "https://github.com/contest-keeper/ck-protocol", rev = "7d7c2ee06268c0f9776cb74c7af3373f00ce4757", version = "0.1.0" }
crc32fast = "1.5.5"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1.1"
