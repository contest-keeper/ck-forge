[package]
name = "ck-base-image"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ck-writer = { path = "../ck-writer", version = "0.1.0" }
ck-image = { git = "https://github.com/contest-keeper/ck-protocol", rev = "9af064ac5e9b1d1fd788485a329c98ac46c1f98a", version = "0.1.0" }
ext4-view = { version = "1.0.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = "3.1.2"
tempfile = "3.27.0"
zstd = { version = "0.13.5", default-features = false }
